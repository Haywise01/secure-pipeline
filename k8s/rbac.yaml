apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: overpermissive-rb
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin # Violation: Excessive permissions / cluster-admin binding
  apiGroup: rbac.authorization.k8s.io

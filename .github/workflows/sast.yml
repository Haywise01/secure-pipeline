name: SAST Scan

on:
  workflow_call:
  push:
    branches: [ main ]

permissions:
  security-events: write
  contents: read

jobs:
  sast:
    name: Run Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

name: IaC Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  detect-iac:
    name: Detect IaC Files
    runs-on: ubuntu-latest

    outputs:
      has_iac: ${{ steps.detect.outputs.has_iac }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for IaC files
        id: detect
        shell: bash
        run: |
          if find . -type f \( \
            -name "*.tf" \
            -o -name "*.tf.json" \
            -o -name "Dockerfile" \
            -o -name "docker-compose.yml" \
            -o -name "docker-compose.yaml" \
          \) -not -path "./.git/*" | grep -q .; then
            echo "has_iac=true" >> "$GITHUB_OUTPUT"
            echo "IaC files detected."
          else
            echo "has_iac=false" >> "$GITHUB_OUTPUT"
            echo "No IaC files detected."
          fi

  iac-security:
    name: Scan Infrastructure as Code
    needs: detect-iac
    if: needs.detect-iac.outputs.has_iac == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,terraform
          output_format: cli
          quiet: false
          soft_fail: false

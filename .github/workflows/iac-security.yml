name: IaC Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  iac-security:
    name: Infrastructure as Code Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: .
          framework: all
          output_format: cli
          quiet: false
          soft_fail: false

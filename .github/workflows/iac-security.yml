name: IaC Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  iac-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC Scan (Terraform + K8s)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: iac/
          framework: terraform,kubernetes
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif
          check: >
            CKV_AWS_18,CKV_AWS_21,CKV_AWS_57,CKV_AWS_63,
            CKV_K8S_14,CKV_K8S_30,CKV_K8S_37
      - name: KICS Scan
        uses: checkmarx/kics-github-action@v2
        with:
          path: 'iac/'
          output_path: 'kics-results/'
          output_formats: 'sarif'
          fail_on: high

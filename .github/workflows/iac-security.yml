name: IaC Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  iac-security:
    name: Infrastructure as Code Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect IaC Files
        id: detect
        shell: bash
        run: |
          if find . -type f \( \
            -name "*.tf" \
            -o -name "*.tf.json" \
            -o -name "*.yaml" \
            -o -name "*.yml" \
            -o -name "Dockerfile" \
            -o -name "docker-compose.yml" \
            -o -name "docker-compose.yaml" \
          \) -not -path "./.git/*" | grep -q .; then
            echo "has_iac=true" >> "$GITHUB_OUTPUT"
            echo "Supported IaC/configuration files detected."
          else
            echo "has_iac=false" >> "$GITHUB_OUTPUT"
            echo "No supported IaC/configuration files detected."
          fi

      - name: Set up Python
        if: steps.detect.outputs.has_iac == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Checkov
        if: steps.detect.outputs.has_iac == 'true'
        run: pip install checkov

      - name: Run Checkov Scan
        if: steps.detect.outputs.has_iac == 'true'
        run: checkov -d . --output sarif --output-file-path checkov-results.sarif
        continue-on-error: true

      - name: Upload Checkov SARIF Report
        if: steps.detect.outputs.has_iac == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif

      - name: IaC Scan Not Applicable
        if: steps.detect.outputs.has_iac != 'true'
        run: |
          echo "No supported IaC/configuration files detected."
          echo "IaC security scan is not applicable."

name: Runtime Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  detect-runtime-policy:
    name: Detect OPA Runtime Policy
    runs-on: ubuntu-latest

    outputs:
      has_policy: ${{ steps.detect.outputs.has_policy }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for OPA Policy
        id: detect
        shell: bash
        run: |
          if [ -f "policies/opa/deployment-policy.rego" ]; then
            echo "has_policy=true" >> "$GITHUB_OUTPUT"
            echo "OPA runtime policy detected."
          else
            echo "has_policy=false" >> "$GITHUB_OUTPUT"
            echo "No OPA runtime policy detected."
          fi

  runtime-security:
    name: Evaluate Runtime Policies
    needs: detect-runtime-policy
    if: needs.detect-runtime-policy.outputs.has_policy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Validate OPA Policy
        run: |
          echo "Validating Open Policy Agent policy..."
          opa check policies/opa/deployment-policy.rego

      - name: Run OPA Policy Check
        run: |
          echo "Evaluating Open Policy Agent runtime compliance..."

          RESULT=$(opa eval \
            --format=json \
            -d policies/opa/deployment-policy.rego \
            "data.pipeline.security.allow")

          echo "$RESULT"

          echo "OPA policy evaluation completed."

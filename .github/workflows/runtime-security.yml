name: Runtime Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  runtime-security:
    name: Runtime Policy Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Detect OPA Policy
        id: detect
        shell: bash
        run: |
          if [ -f "policies/opa/deployment-policy.rego" ]; then
            echo "has_policy=true" >> "$GITHUB_OUTPUT"
            echo "OPA runtime policy detected."
          else
            echo "has_policy=false" >> "$GITHUB_OUTPUT"
            echo "No OPA runtime policy detected."
          fi

      - name: Set up OPA
        if: steps.detect.outputs.has_policy == 'true'
        uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.9.0"

      - name: Validate OPA Policy
        if: steps.detect.outputs.has_policy == 'true'
        run: |
          echo "Validating Open Policy Agent policy..."
          opa check policies/opa/deployment-policy.rego

      - name: Evaluate OPA Policy
        if: steps.detect.outputs.has_policy == 'true'
        shell: bash
        run: |
          echo "Evaluating Open Policy Agent runtime compliance..."

          RESULT=$(opa eval \
            --format=raw \
            --data policies/opa/deployment-policy.rego \
            "data.pipeline.security.allow")

          echo "OPA decision: $RESULT"

          if [ "$RESULT" != "true" ]; then
            echo "OPA policy denied the deployment."
            exit 1
          fi

          echo "OPA policy passed."

      - name: Runtime Policy Not Applicable
        if: steps.detect.outputs.has_policy != 'true'
        run: |
          echo "No OPA policy detected."
          echo "Runtime policy security is not applicable."

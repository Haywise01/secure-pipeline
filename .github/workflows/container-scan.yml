name: Container Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  detect-container:
    name: Detect Dockerfile
    runs-on: ubuntu-latest
    outputs:
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: detect
        run: |
          if [ -f "Dockerfile" ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile detected."
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile detected."
          fi

  container-scan:
    name: Build and Scan Container
    needs: detect-container
    if: needs.detect-container.outputs.has_dockerfile == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: secure-app:latest

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-app:latest
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

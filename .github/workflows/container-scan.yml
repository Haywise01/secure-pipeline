name: Container Security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Detect Dockerfile
        id: detect
        shell: bash
        run: |
          if find . \
            -type f \
            -name 'Dockerfile' \
            -not -path './.git/*' \
            -print -quit | grep -q .; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile detected."
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile detected."
          fi

      - name: Set up Docker Buildx
        if: steps.detect.outputs.has_dockerfile == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        if: steps.detect.outputs.has_dockerfile == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: secure-app:latest

      - name: Run Trivy Container Vulnerability Scanner
        if: steps.detect.outputs.has_dockerfile == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-app:latest
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false

      - name: Container Scan Not Applicable
        if: steps.detect.outputs.has_dockerfile != 'true'
        run: |
          echo "No Dockerfile detected."
          echo "Container security scan is not applicable."

name: Container and SBOM Security Gate

on:
  push:
    branches: [ main ]

jobs:
  build-and-scan:
    name: Build, SBOM, and Scan Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create SBOM Directory
        run: mkdir -p ./sbom

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ./sbom/sbom-cyclonedx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: ./sbom/sbom-cyclonedx.json

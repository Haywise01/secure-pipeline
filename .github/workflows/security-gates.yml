name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  call-sast:
    uses: Haywise01/secure-pipeline/.github/workflows/sast.yml@main

  call-container-scan:
    uses: Haywise01/secure-pipeline/.github/workflows/container-scan.yml@main

  call-iac-security:
    uses: Haywise01/secure-pipeline/.github/workflows/iac-security.yml@main

  call-runtime-security:
    uses: Haywise01/secure-pipeline/.github/workflows/runtime-security.yml@main

  evaluate-final-gate:
    name: Final Security Gate
    needs:
      - call-sast
      - call-container-scan
      - call-iac-security
      - call-runtime-security
    runs-on: ubuntu-latest

    steps:
      - name: Security Gate Passed
        run: |
          echo "All applicable security checks passed."
          echo "Pipeline compliance gates cleared."

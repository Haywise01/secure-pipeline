name: Security Gates & OIDC Deployment

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  security-gates-pass:
    name: Evaluate All Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsSecurePipelineRole
          aws-region: us-east-1

      - name: Verify AWS Connection (No Long-Lived Secrets)
        run: aws sts get-caller-identity

  provenance:
    name: Generate SLSA Build Provenance
    needs: security-gates-pass
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: secure-app
      digest: sha256:abcdef1234567890...

name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  call-sast:
    uses: ./.github/workflows/sast.yml

  call-container-scan:
    uses: ./.github/workflows/container-scan.yml

  call-iac-security:
    uses: ./.github/workflows/iac-security.yml

  call-runtime-security:
    uses: ./.github/workflows/runtime-security.yml

  evaluate-final-gate:
    needs: [call-sast, call-container-scan, call-iac-security, call-runtime-security]
    runs-on: ubuntu-latest
    steps:
      - name: All Security Gates Passed
        run: |
          echo "All modular DevSecOps security workflows executed successfully."
          echo "Pipeline compliance gates cleared."

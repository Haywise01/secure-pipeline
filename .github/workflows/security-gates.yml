name: DevSecOps Security Gate

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:

  sast:
    name: SAST and Secret Scanning
    uses: Haywise01/secure-pipeline/.github/workflows/sast.yml@main

  container:
    name: Container Security
    uses: Haywise01/secure-pipeline/.github/workflows/container-scan.yml@main

  iac:
    name: IaC Security
    uses: Haywise01/secure-pipeline/.github/workflows/iac-security.yml@main

  runtime:
    name: Runtime Security
    uses: Haywise01/secure-pipeline/.github/workflows/runtime-security.yml@main

  final-gate:
    name: Final Security Gate
    if: ${{ always() }}
    needs:
      - sast
      - container
      - iac
      - runtime
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate Security Results
        shell: bash
        run: |
          echo "========================================"
          echo "       DevSecOps Security Gate"
          echo "========================================"
          echo ""
          echo "SAST:       ${{ needs.sast.result }}"
          echo "Container:  ${{ needs.container.result }}"
          echo "IaC:        ${{ needs.iac.result }}"
          echo "Runtime:    ${{ needs.runtime.result }}"
          echo ""

          if [ "${{ needs.sast.result }}" != "success" ]; then
            echo "❌ SAST security gate failed."
            exit 1
          fi

          if [ "${{ needs.container.result }}" != "success" ]; then
            echo "❌ Container security gate failed."
            exit 1
          fi

          if [ "${{ needs.iac.result }}" != "success" ]; then
            echo "❌ IaC security gate failed."
            exit 1
          fi

          if [ "${{ needs.runtime.result }}" != "success" ]; then
            echo "❌ Runtime security gate failed."
            exit 1
          fi

          echo "========================================"
          echo "✅ ALL SECURITY GATES PASSED"
          echo "========================================"

version: "1.0"
project: "Secure Pipeline Application"
owner: "DevSecOps Team"
trust_boundaries:
  - name: "Public Internet to API Gateway"
    description: "Ingress traffic entering through WAF and reverse proxy."
  - name: "API Gateway to Internal Microservices"
    description: "Internal service mesh communication over mTLS."
assets:
  - id: "ASSET-01"
    name: "User Database"
    classification: "Confidential"
  - id: "ASSET-02"
    name: "JWT Authentication Tokens"
    classification: "Sensitive"
threats:
  - id: "THR-01"
    category: "SQL Injection"
    target: "ASSET-01"
    mitigation: "Use parameterized queries and ORM validation."
  - id: "THR-02"
    category: "Broken Authentication"
    target: "ASSET-02"
    mitigation: "Enforce short-lived tokens and secure cookie flags."
